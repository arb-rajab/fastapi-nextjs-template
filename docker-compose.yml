services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starterapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starterapp}
      POSTGRES_DB: ${POSTGRES_DB:-starterapp}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starterapp} -d ${POSTGRES_DB:-starterapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Runtime role: created by migration 0002 (which runs as
      # DATABASE_ADMIN_URL), so this URL only works after migrations ran.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${APP_DB_ROLE:-starterapp_app}:${APP_DB_PASSWORD:-starterapp_app_dev_only}@postgres:5432/starterapp}
      # Migration/admin role: full DDL rights.
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://${POSTGRES_USER:-starterapp}:${POSTGRES_PASSWORD:-starterapp}@postgres:5432/starterapp}
      APP_DB_ROLE: ${APP_DB_ROLE:-starterapp_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-starterapp_app_dev_only}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Dev-only fallback; override with a long random value for any
      # non-local deployment.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-starterapp-dev-only-jwt-secret-DO-NOT-USE-IN-PRODUCTION}
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Server-side URL the Next.js route handlers use to reach the backend.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
